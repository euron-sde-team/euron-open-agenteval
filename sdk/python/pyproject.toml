[project]
name = "euron-agenteval"
version = "0.1.0"
description = "Python client and CLI for Euron Open AgentEval: register an agent, run it against a versioned dataset, and compare runs over time, against a running AgentEval server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "agenteval",
  "httpx>=0.28",
  "click>=8.1",
  "opentelemetry-api>=1.27",
]

[project.scripts]
agenteval-cli = "agenteval_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval_sdk", "src/agenteval_cli"]

[tool.uv.sources]
agenteval = { path = "../../apps/api", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8", "mypy>=1.14"]
