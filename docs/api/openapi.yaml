                $ref: '#/components/schemas/TraceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orgs/{org_id}/evaluation-runs/{run_id}/test-cases/{test_case_id}/trace:
    get:
      tags:
      - traces
      summary: The trace matching one evaluation result, by run and test case (AC6)
      operationId: get_trace_for_run_and_case_api_v1_orgs__org_id__evaluation_runs__run_id__test_cases__test_case_id__trace_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      - name: test_case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Test Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orgs/{org_id}/benchmarks/compare:
    get:
      tags:
      - benchmarks
      summary: Pairwise comparison between two evaluation runs (AC8)
      operationId: compare_api_v1_orgs__org_id__benchmarks_compare_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      - name: baseline_run_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Baseline Run Id
      - name: candidate_run_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Candidate Run Id
      - name: regression_threshold
        in: query
        required: false
        schema:
          type: number
          maximum: 1
          exclusiveMinimum: 0
          default: 0.05
          title: Regression Threshold
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
