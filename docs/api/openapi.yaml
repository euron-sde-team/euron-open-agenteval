                title: Response List Keys Api V1 Orgs  Org Id  Api Keys Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - api-keys
      summary: Create an API key
      operationId: create_key_api_v1_orgs__org_id__api_keys_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      requestBody:
        required: true
