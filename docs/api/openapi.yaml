          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orgs/{org_id}/api-keys/{key_id}:
    delete:
      tags:
      - api-keys
      summary: Revoke an API key
      operationId: revoke_key_api_v1_orgs__org_id__api_keys__key_id__delete
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orgs/{org_id}/audit-log:
    get:
      tags:
      - audit
      summary: This organization's audit log
      operationId: list_audit_log_api_v1_orgs__org_id__audit_log_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      - name: limit
        in: query
        required: false
